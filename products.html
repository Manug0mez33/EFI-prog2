<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freskø products - Tailwind CSS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="CSS/styles.css" /> 
</head>
<body class="bg-gray-100">

    <nav class="bg-black p-4">
      <div class="container mx-auto flex items-center justify-between relative">
        <a href="#">
          <img src="IMG/fresko-isotipo.png" alt="Logo" class="h-32 w-auto"/>
        </a>

        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 hidden lg:block">
          <img src="IMG/fresko-logo.png" class="h-[70px]" alt="Fresko's logo" />
        </div>

        <div class="hidden md:flex items-center space-x-2">
            <a href="#" class="text-white hover:bg-gray-800 px-4 py-2 rounded-md transition-colors">Inicio</a>
            <a href="about.html" class="text-white hover:bg-gray-800 px-4 py-2 rounded-md transition-colors">Nosotros</a>
            <a href="products.html" class="text-white hover:bg-gray-800 px-4 py-2 rounded-md transition-colors">Artículos</a>
        </div>

        <div class="md:hidden">
            <button id="menu-btn" class="text-white focus:outline-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>
        </div>
      </div>

      <div id="mobile-menu" class="hidden md:hidden mt-4">
        <a href="#" class="block text-white text-center py-2 hover:bg-gray-800 rounded-md">Inicio</a>
        <a href="about.html" class="block text-white text-center py-2 hover:bg-gray-800 rounded-md">Nosotros</a>
        <a href="products.html" class="block text-white text-center py-2 hover:bg-gray-800 rounded-md">Artículos</a>
      </div>
    </nav>  
    
    <!-- THIS IS THE PRODUCTS SECTION -->
    <section class="container mx-auto py-12 px-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8" id="productsContainer">
        </div>
    </section>
    <!---------------------------------->

    <!-- THIS IS THE MODAL SECTION -->
     <section class="modalSection">
        <div id="modal" class="fixed inset-0 hidden items-center justify-center bg-black bg-opacity-50 z-50">
        <div class="bg-white rounded-lg shadow-lg w-11/12 max-w-4xl p-6 relative transform scale-95 opacity-0 transition-all duration-200">
            
            <button id="closeModal" class="absolute top-4 right-4 text-gray-500 hover:text-black text-2xl">&times;</button>

            <div class="flex flex-col md:grid md:grid-cols-2 md:gap-8">

            <div class="flex flex-col items-start space-y-4 mb-6 md:mb-0">
                <a href="#" id="backToProducts" class="text-sm text-gray-500 flex items-center space-x-2">
                <span>&larr;</span> <span>VOLVER A TODOS LOS PRODUCTOS</span>
                </a>
                <img id="modalImg" src="" alt="Producto" class="w-full h-auto object-contain rounded-lg">
            </div>

            <div class="flex flex-col justify-between">
                <div>
                <p id="modalName" class="text-2xl font-bold mb-2"></p>
                <p id="modalPlaceholder" class="text-gray-800 font-bold mb-2"></p>
                <p id="modalDescription" class="text-gray-600 mb-4"></p>
                <p id="modalPrice" class="text-xl font-semibold mb-6"></p>

                <h3 class="font-bold mb-2">TALLES DISPONIBLES</h3>
                <div id="modalSizes" class="flex gap-2 mb-6"></div>
                </div>

                <div class="flex flex-col sm:flex-row sm:space-x-4 space-y-3 sm:space-y-0">
                <button class="bg-black text-white px-4 py-2 rounded hover:bg-gray-800">
                    AGREGAR AL CARRITO
                </button>
                <button class="border border-gray-400 px-4 py-2 rounded hover:bg-gray-200">
                    AÑADIR A LA LISTA DE DESEADOS
                </button>
                </div>
            </div>
            </div>
        </div>
        </div>
     </section>
    <!------------------------------->


    <footer class="bg-black text-white mt-12 w-full flex flex-col justify-center items-center py-8">
      <img src="IMG/fresko-logo.png" class="h-8 mb-6" alt="Fresko's logo"/>
      <div class="flex space-x-6 mb-4">
        <a href="https://www.instagram.com/fresko.tm/" target="_blank" class="hover:opacity-75 transition-opacity">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="30" height="30" viewBox="0,0,256,256" class="fill-current">
            <g fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none" font-size="none" text-anchor="none" style="mix-blend-mode: normal"><g transform="scale(5.12,5.12)"><path d="M16,3c-7.16752,0 -13,5.83248 -13,13v18c0,7.16752 5.83248,13 13,13h18c7.16752,0 13,-5.83248 13,-13v-18c0,-7.16752 -5.83248,-13 -13,-13zM16,5h18c6.08648,0 11,4.91352 11,11v18c0,6.08648 -4.91352,11 -11,11h-18c-6.08648,0 -11,-4.91352 -11,-11v-18c0,-6.08648 4.91352,-11 11,-11zM37,11c-1.10457,0 -2,0.89543 -2,2c0,1.10457 0.89543,2 2,2c1.10457,0 2,-0.89543 2,-2c0,-1.10457 -0.89543,-2 -2,-2zM25,14c-6.06329,0 -11,4.93671 -11,11c0,6.06329 4.93671,11 11,11c6.06329,0 11,-4.93671 11,-11c0,-6.06329 -4.93671,-11 -11,-11zM25,16c4.98241,0 9,4.01759 9,9c0,4.98241 -4.01759,9 -9,9c-4.98241,0 -9,-4.01759 -9,-9c0,-4.98241 4.01759,-9 9,-9z"></path></g></g>
          </svg>
        </a>
        <a href="mailto:freskoindumentaria@gmail.com" class="hover:opacity-75 transition-opacity">
          <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="30" height="30" viewBox="0,0,256,256" class="fill-current">
            <g fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="none" font-weight="none" font-size="none" text-anchor="none" style="mix-blend-mode: normal"><g transform="scale(5.12,5.12)"><path d="M14,4c-5.51133,0 -10,4.48867 -10,10v22c0,5.51133 4.48867,10 10,10h22c5.51133,0 10,-4.48867 10,-10v-22c0,-5.51133 -4.48867,-10 -10,-10zM14,6h22c4.43067,0 8,3.56933 8,8v22c0,4.43067 -3.56933,8 -8,8h-22c-4.43067,0 -8,-3.56933 -8,-8v-22c0,-4.43067 3.56933,-8 8,-8zM13,15c-1.64497,0 -3,1.35503 -3,3v14c0,1.64497 1.35503,3 3,3h24c1.64497,0 3,-1.35503 3,-3v-14c0,-1.64497 -1.35503,-3 -3,-3zM13.41406,17h23.16992l-8.90625,8.89258c-1.49279,1.49041 -3.8809,1.49024 -5.37305,-0.00195zM38,18.41211v13.17578l-6.59766,-6.58789zM12,18.41406l6.58594,6.58594l-6.58594,6.58594zM29.98828,26.41211l6.59766,6.58789h-23.17188l6.58594,-6.58594l0.89063,0.89063c2.25585,2.25585 5.94201,2.25751 8.19922,0.00391z"></path></g></g>
          </svg>
        </a>
      </div>
      <p class="text-gray-400 text-sm">Todos los derechos reservados | 2025</p>
    </footer>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
    <script src="js/see-more.js"></script>
</body>
</html>
